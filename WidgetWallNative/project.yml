name: WidgetWallNative
options:
  bundleIdPrefix: com.widgetwall
  deploymentTarget:
    macOS: 14.0

targets:
  WidgetWall:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_NAME: WidgetWall
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetwall.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSUIElement: YES
    dependencies:
      - target: WidgetWallExtension
        embed: true

  WidgetWallExtension:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_NAME: WidgetWallExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetwall.app.WidgetWallExtension
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
